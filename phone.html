<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>杨锟的 iPhone</title>
  <meta name="theme-color" content="#000">
  <link rel="icon" href="images/favicon.ico">
  <link rel="stylesheet" href="phone.css?v=5">
</head>
<body>
  <div class="device">
    <div class="phone" data-presence>
      <div class="wallpaper" aria-hidden="true"></div>

      <header class="status" id="status">
        <span class="status-time" data-time>9:41</span>
        <i class="island" aria-hidden="true"></i>
        <span class="glyphs" aria-hidden="true">
          <svg class="sig" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg class="wifi" viewBox="0 0 16 12"><path d="M8 11.2a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6z"/><path d="M5.3 8.3a3.9 3.9 0 0 1 5.4 0" fill="none" stroke-width="1.5" stroke-linecap="round"/><path d="M3 6a7.2 7.2 0 0 1 10 0" fill="none" stroke-width="1.5" stroke-linecap="round"/><path d="M.8 3.7a10.4 10.4 0 0 1 14.4 0" fill="none" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="batt"><b></b></span>
        </span>
      </header>

      <section class="lockscreen" id="lockscreen">
        <div class="lock-notice" aria-hidden="true"></div>
        <p class="lock-date" data-date></p>
        <p class="lock-time" data-time>9:41</p>
        <div class="lock-tools">
          <button type="button" class="orb" data-lock-tool="flashlight" aria-label="手电筒"></button>
          <button type="button" class="orb cam" data-lock-tool="camera" aria-label="相机"></button>
        </div>
        <div class="lock-unlock">
          <button type="button" class="unlock-btn" id="unlock-btn">向上轻扫或点按以打开</button>
        </div>
        <i class="homebar" aria-hidden="true"></i>
      </section>

      <main class="home" id="home">
        <p class="pill" data-presence-label>连接中</p>
        <div class="grid" id="grid"></div>
        <div class="pagedots" aria-hidden="true"><i class="on"></i><i></i></div>
        <nav class="dockbar" id="dockbar" aria-label="程序坞"></nav>
      </main>

      <div id="screens"></div>

      <div class="gesture-zone" id="gesture-zone" aria-hidden="true">
        <i class="homebar" id="home-indicator"></i>
      </div>
      <div class="cursors"></div>
    </div>
  </div>
  <script src="profile.js?v=5"></script>
  <script src="views.js?v=5"></script>
  <script src="icons.js?v=5"></script>
  <script src="presence-client.js?v=5"></script>
  <script src="phone.js?v=5"></script>
</body>
</html>
