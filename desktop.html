<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>杨锟的 Mac</title>
  <script>
    if (!/[?&]desk=1(?:&|$)/.test(location.search) && /iPhone|iPod|Android.+Mobile|Windows Phone/i.test(navigator.userAgent)) {
      location.replace("phone.html");
    }
  </script>
  <link rel="icon" href="images/favicon.ico">
  <link rel="stylesheet" href="desk.css">
</head>
<body>
  <div class="mac" data-presence>
    <header class="menubar">
      <div class="menuleft">
        <span class="mark" aria-hidden="true"></span>
        <b class="appname">访达</b>
        <span>文件</span><span>编辑</span><span>显示</span><span>前往</span><span>窗口</span><span>帮助</span>
      </div>
      <div class="menuright">
        <a href="phone.html">iPhone</a>
        <span data-presence-label>连接中</span>
        <span class="battery" aria-hidden="true"></span>
        <time class="clock"></time>
      </div>
    </header>
    <div class="desktop">
      <div class="icons"></div>
      <div class="windows"></div>
    </div>
    <nav class="dock" aria-label="程序坞"></nav>
    <div class="cursors"></div>
  </div>
  <script src="profile.js"></script>
  <script src="views.js"></script>
  <script src="icons.js"></script>
  <script src="presence-client.js"></script>
  <script src="shell.js"></script>
</body>
</html>
